name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nexvirosolution
          outputs: |
            dist/snake-dark.svg?color_snake=#2DE600&color_dots=#101810,#143d0a,#1f7a0a,#2DE600,#8dff66
            dist/snake-light.svg?color_snake=#1a6b00&color_dots=#e8ebe0,#c4eeaa,#7be04a,#2DA600,#1a6b00

      - name: Push snake to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate snake"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
